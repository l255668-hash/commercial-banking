name: tests

on:
  push:
  pull_request:

jobs:
  model:
    name: model, demo and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python banking_system.py --test
      - name: Demonstration ends with a zero trial balance
        run: python banking_system.py | tee demo.txt | grep -E "TOTAL +0\.00"
      - name: Class and operation counts
        run: python banking_system.py --classes | tail -1
      - name: Assistant tests (offline; Claude is replaced by a stand-in)
        run: python banking_assistant.py --test
      - name: Lint
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes banking_system.py banking_gui.py banking_assistant.py tools/*.py

  gui:
    name: GUI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Drive every check, form and the onboarding story
        run: xvfb-run -a python tools/gui_smoke_test.py

  diagrams:
    name: Diagrams match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate every SVG and compare with the committed ones
        run: |
          python banking_system.py --diagram docs
          python tools/make_flowcharts.py
          python tools/make_state_diagrams.py
          git diff --exit-code -- 'docs/*.svg'
