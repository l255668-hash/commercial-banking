<text x="475" y="1793" text-anchor="middle" font-size="11.5" fill="#FFFFFF" font-weight="bold">ProductNotAvailable /</text><text x="475" y="1807" text-anchor="middle" font-size="11.5" fill="#FFFFFF" font-weight="bold">KycIncomplete</text>
