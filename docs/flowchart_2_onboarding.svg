<text x="185" y="155" text-anchor="middle" font-size="11.5" fill="#FFFFFF" font-weight="bold">Start: a new person or</text><text x="185" y="168" text-anchor="middle" font-size="11.5" fill="#FFFFFF" font-weight="bold">organisation approaches the</text><text x="185" y="182" text-anchor="middle" font-size="11.5" fill="#FFFFFF" font-weight="bold">bank</text>
<polygon points="76,271 310,271 294,329 60,329" fill="#E6EEF9" stroke="#3D5A80" stroke-width="1.5"/>
<text x="185" y="291" text-anchor="middle" font-size="11.5" fill="#1D2B2A">Register the party: Person,</text><text x="185" y="304" text-anchor="middle" font-size="11.5" fill="#1D2B2A">Company or Charity (one record</text><text x="185" y="318" text-anchor="middle" font-size="11.5" fill="#1D2B2A">per real identity)</text>
