<text x="185" y="1113" text-anchor="middle" font-size="11.5" fill="#1D2B2A">become_customer(): by a branch</text><text x="185" y="1127" text-anchor="middle" font-size="11.5" fill="#1D2B2A">employee, with a segment</text>
