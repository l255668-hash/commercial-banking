<polygon points="185,658 316,708 185,758 54,708" fill="#FFF3D6" stroke="#B8862F" stroke-width="1.5"/>
<text x="185" y="705" text-anchor="middle" font-size="11.5" fill="#1D2B2A">Document issued and not</text><text x="185" y="719" text-anchor="middle" font-size="11.5" fill="#1D2B2A">expired today?</text>
<rect x="355" y="677" width="240" height="62" fill="#FFFFFF" stroke="#34495E" stroke-width="1.5"/>
<text x="475" y="705" text-anchor="middle" font-size="11.5" fill="#1D2B2A">Record a FAIL check (kept, never</text><text x="475" y="719" text-anchor="middle" font-size="11.5" fill="#1D2B2A">deleted)</text>
