<text x="185" y="427" text-anchor="middle" font-size="11.5" fill="#1D2B2A">File identity documents (CNIC,</text><text x="185" y="440" text-anchor="middle" font-size="11.5" fill="#1D2B2A">passport, incorporation</text><text x="185" y="454" text-anchor="middle" font-size="11.5" fill="#1D2B2A">certificate...)</text>
