<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif"><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="70" font-size="38" font-weight="bold" fill="#0B4F4A">The class model at a glance</text><text x="60" y="108" font-size="20" fill="#5B6B69">Four inheritance hierarchies, linked by association to standalone classes</text><rect x="80" y="170" width="420" height="84" rx="10" fill="#E3EEF9" stroke="#3D5A80" stroke-width="2.5"/><text x="290" y="190" text-anchor="middle" font-size="13" fill="#5B6B69">«abstract»</text><text x="290" y="210" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A" font-style="italic">Party</text><rect x="80" y="262" width="420" height="138" rx="10" fill="#F6F9F8" stroke="#C9D6D3"/><text x="96" y="292" font-size="16" fill="#1D2B2A">Person, Organization, Company, Charity</text><rect x="1100" y="170" width="420" height="84" rx="10" fill="#E3EEF9" stroke="#3D5A80" stroke-width="2.5"/><text x="1310" y="190" text-anchor="middle" font-size="13" fill="#5B6B69">«abstract»</text><text x="1310" y="210" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A" font-style="italic">Arrangement</text><rect x="1100" y="262" width="420" height="138" rx="10" fill="#F6F9F8" stroke="#C9D6D3"/><text x="1116" y="292" font-size="16" fill="#1D2B2A">DepositAccount, CurrentAccount</text><text x="1116" y="316" font-size="16" fill="#1D2B2A">SavingsAccount, FixedTermDeposit</text><text x="1116" y="340" font-size="16" fill="#1D2B2A">FinancingAgreement</text><rect x="80" y="560" width="420" height="84" rx="10" fill="#E3EEF9" stroke="#3D5A80" stroke-width="2.5"/><text x="290" y="580" text-anchor="middle" font-size="13" fill="#5B6B69">«abstract»</text><text x="290" y="600" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A" font-style="italic">Case</text><rect x="80" y="652" width="420" height="138" rx="10" fill="#F6F9F8" stroke="#C9D6D3"/><text x="96" y="682" font-size="16" fill="#1D2B2A">CustomerCase, Dispute, Complaint</text><text x="96" y="706" font-size="16" fill="#1D2B2A">ServiceRequest, RiskCase, FraudAlert</text><text x="96" y="730" font-size="16" fill="#1D2B2A">ComplianceInvestigation, CollectionsCase</text><rect x="1100" y="560" width="420" height="84" rx="10" fill="#E3EEF9" stroke="#3D5A80" stroke-width="2.5"/><text x="1310" y="580" text-anchor="middle" font-size="13" fill="#5B6B69">«abstract»</text><text x="1310" y="600" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A" font-style="italic">BankTransaction</text><rect x="1100" y="652" width="420" height="138" rx="10" fill="#F6F9F8" stroke="#C9D6D3"/><text x="1116" y="682" font-size="16" fill="#1D2B2A">CustomerPayment, TransferPayment</text><text x="1116" y="706" font-size="16" fill="#1D2B2A">CardPayment, BillPayment, OwnAccountTransfer</text><text x="1116" y="730" font-size="16" fill="#1D2B2A">CashTransaction, FeeCharge, InterestCredit</text><text x="1116" y="754" font-size="16" fill="#1D2B2A">Reversal, Chargeback, MerchantRefund</text><text x="1116" y="778" font-size="16" fill="#1D2B2A">InternalTransfer, LoanTransaction</text><rect x="590" y="190" width="420" height="70" rx="10" fill="#E4F2EC" stroke="#2E7D5B" stroke-width="2.5"/><text x="800" y="220" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A">Mandate</text><text x="800" y="242" text-anchor="middle" font-size="14" fill="#5B6B69">who may act for an organisation, for a period</text><rect x="590" y="330" width="420" height="70" rx="10" fill="#E4F2EC" stroke="#2E7D5B" stroke-width="2.5"/><text x="800" y="360" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A">ProductDefinition</text><text x="800" y="382" text-anchor="middle" font-size="14" fill="#5B6B69">what the bank sells, versioned terms</text><rect x="590" y="470" width="420" height="70" rx="10" fill="#E4F2EC" stroke="#2E7D5B" stroke-width="2.5"/><text x="800" y="500" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A">IssuedCard</text><text x="800" y="522" text-anchor="middle" font-size="14" fill="#5B6B69">a card linked to an account; replacement chain</text><rect x="590" y="610" width="420" height="70" rx="10" fill="#E4F2EC" stroke="#2E7D5B" stroke-width="2.5"/><text x="800" y="640" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A">Employee</text><text x="800" y="662" text-anchor="middle" font-size="14" fill="#5B6B69">dated roles; approvals keep the role then</text><polyline points="500,225 590,225" fill="none" stroke="#34495E" stroke-width="2.2"/><text x="545" y="214" text-anchor="middle" font-size="16" font-style="italic" fill="#8A5A00">acts for</text><polyline points="290,170 290,140 1310,140 1310,170" fill="none" stroke="#34495E" stroke-width="2.2" stroke-dasharray="7 6"/><text x="800" y="132" text-anchor="middle" font-size="16" font-style="italic" fill="#8A5A00">holds (a customer holds arrangements)</text><polyline points="1010,365 1100,365" fill="none" stroke="#34495E" stroke-width="2.2"/><text x="1055" y="354" text-anchor="middle" font-size="16" font-style="italic" fill="#8A5A00">sold as</text><polyline points="1010,490 1100,390" fill="none" stroke="#34495E" stroke-width="2.2"/><text x="1032" y="425" text-anchor="start" font-size="16" font-style="italic" fill="#8A5A00">linked to</text><polyline points="1010,520 1100,610" fill="none" stroke="#34495E" stroke-width="2.2"/><text x="1032" y="588" text-anchor="start" font-size="16" font-style="italic" fill="#8A5A00">used by</text><polyline points="290,400 290,560" fill="none" stroke="#34495E" stroke-width="2.2"/><text x="300" y="485" text-anchor="start" font-size="16" font-style="italic" fill="#8A5A00">about a party</text><polyline points="500,632 590,632" fill="none" stroke="#34495E" stroke-width="2.2"/><text x="545" y="621" text-anchor="middle" font-size="16" font-style="italic" fill="#8A5A00">handled by</text><polyline points="1010,662 1100,662 1100,644" fill="none" stroke="#34495E" stroke-width="2.2"/><text x="1032" y="690" text-anchor="start" font-size="16" font-style="italic" fill="#8A5A00">approves</text><polyline points="1310,400 1310,560" fill="none" stroke="#34495E" stroke-width="2.2"/><text x="1320" y="485" text-anchor="start" font-size="16" font-style="italic" fill="#8A5A00">posts to the ledger</text><text x="60" y="870" font-size="16" fill="#5B6B69">Inheritance only for a true &quot;is-a&quot;; everything else is an association. Detail: class_diagram.png and the UML diagrams.</text></svg>
