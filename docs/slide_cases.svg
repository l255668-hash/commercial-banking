<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif"><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="70" font-size="38" font-weight="bold" fill="#0B4F4A">Cases: customer, risk and collections work</text><text x="60" y="108" font-size="20" fill="#5B6B69">Shared history at the top; who handles it and how it closes differ below</text><rect x="630" y="150" width="340" height="84" rx="10" fill="#E3EEF9" stroke="#3D5A80" stroke-width="2.5"/><text x="800" y="170" text-anchor="middle" font-size="13" fill="#5B6B69">«abstract»</text><text x="800" y="190" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A" font-style="italic">Case</text><text x="800" y="212" text-anchor="middle" font-size="14" fill="#5B6B69">subject, status, notes, evidence</text><polyline points="800,252 800,280" fill="none" stroke="#34495E" stroke-width="2.2"/><polygon points="800,234 789,252 811,252" fill="#FFFFFF" stroke="#34495E" stroke-width="2.2"/><polyline points="482,280 1118,280" fill="none" stroke="#34495E" stroke-width="2.2"/><polyline points="482,280 482,330" fill="none" stroke="#34495E" stroke-width="2.2"/><rect x="332" y="330" width="300" height="84" rx="10" fill="#E4F2EC" stroke="#2E7D5B" stroke-width="2.5"/><text x="482" y="360" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A">CollectionsCase</text><text x="482" y="382" text-anchor="middle" font-size="14" fill="#5B6B69">overdue loan, promises</text><polyline points="800,280 800,330" fill="none" stroke="#34495E" stroke-width="2.2"/><rect x="650" y="330" width="300" height="84" rx="10" fill="#E4F2EC" stroke="#2E7D5B" stroke-width="2.5"/><text x="800" y="360" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A">CustomerCase</text><text x="800" y="382" text-anchor="middle" font-size="14" fill="#5B6B69">channel, contact person</text><polygon points="666,414 655,432 677,432" fill="#FFFFFF" stroke="#34