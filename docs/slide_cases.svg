vestigation</text><text x="1133" y="506" text-anchor="middle" font-size="14" fill="#5B6B69">opened by compliance</text><polyline points="984,492 998,492" fill="none" stroke="#34495E" stroke-width="2.2"/><rect x="998" y="546" width="270" height="76" rx="10" fill="#FBEFD9" stroke="#B8862F" stroke-width="2.5"/><text x="1133" y="576" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A">FraudAlert</text><text x="1133" y="598" text-anchor="middle" font-size="14" fill="#5B6B69">rule, transaction</text><polyline points="984,584 998,584" fill="none" stroke="#34495E" stroke-width="2.2"/><polyline points="984,432 984,584" fill="none" stroke="#34495E" stroke-width="2.2"/></svg>
