-width="2.5"/><text x="519" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#1D2B2A">FeeCharge</text><text x="519" y="382" text-anchor="middle" font-size="14" fill="#5B6B69">fee, terms version</text><polyline points="706,280 706,330" fill="none" stroke="#34495E" stroke-width="2.2"/><rect x="622" y="330" width="169" height="84" rx="10" fill="#E4F2EC" stroke="#2E7D5B" stroke-width="2.5"/><text x="706" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#1D2B2A">InterestCredit</text><text x="706" y="382" text-anchor="middle" font-size="14" fill="#5B6B69">account, rate</text><polyline points="894,280 894,330" fill="none" stroke="#34495E" stroke-width="2.2"/><rect x="809" y="330" width="169" height="84" rx="10" fill="#E4F2EC" stroke="#2E7D5B" stroke-width="2.5"/><text x="894" y="360" text-anchor="middle" font-size="15" font-weight="bold" fill="#1D2B2A">InternalTransfer</text><text x="894" y="382" text-anchor="middle" font-size="14" fill="#5B6B69">bank&#x27;s own books</text><polyline points="1081,280 1081,330" fill="none" stroke="#34495E" stroke-width="2.2"/><rect x="996" y="330" width="169" height="84" rx="10" fill="#E4F2EC" stroke="#2E7D5B" stroke-width="2.5"/><text x="1081" y="350" text-anchor="middle" font-size="13" fill="#5B6B69">«abstract»</text><text x="1081" y="370" text-anchor="middle" font-size="16" font-weight="bold" fill="#1D2B2A" font-style="italic">LoanTransaction</text><text x="1081" y="392" text-anchor="middle" font-size="14" fill="#5B6B69">financing agreement</text><polygon points="1012,414 1001,432 1023,432" fill="#FFFFFF" stroke="#34495E" stroke-width="2.2"/><rect x="1026" y="454" width="236" height="76" rx="10" fill="#FBEFD9" stroke="#B8862F" stroke-width="2.5"/><text x="1144" y="484" text-anchor="middle" font-size="16" font-weight="bold" fill="#1D2B2A">InterestCapitalisation</text><text x="1144" y="506" text-anchor="middle" font-size="14" fill="#5B6B69">interest to principal</text><polyline points="1012,492 1026,