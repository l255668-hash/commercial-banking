<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif"><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="70" font-size="38" font-weight="bold" fill="#0B4F4A">Transactions: nothing is edited or deleted</text><text x="60" y="108" font-size="20" fill="#5B6B69">Reversals and chargebacks are new records linked to the original</text><rect x="630" y="150" width="340" height="84" rx="10" fill="#E3EEF9" stroke="#3D5A80" stroke-width="2.5"/><text x="800" y="170" text-anchor="middle" font-size="13" fill="#5B6B69">«abstract»</text><text x="800" y="190" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A" font-style="italic">BankTransaction</text><text x="800" y="212" text-anchor="middle" font-size="14" fill="#5B6B69">amount, status, ledger entries</text><polyline points="800,252 800,280" fill="none" stroke="#34495E" stroke-width="2.2"/><polygon points="800,234 789,252 811,252" fill="#FFFFFF" stroke="#34495E" stroke-width="2.2"/><polyline points="145,280 1455,280" fill="none" stroke="#34495E" stroke-width="2.2"/><polyline points="145,280 145,330" fill="none" stroke="#34495E" stroke-width="2.2"/><rect x="60" y="330" width="169" height="84" rx="10" fill="#E4F2EC" stroke="#2E7D5B" stroke-width="2.5"/><text x="145" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#1D2B2A">CashTransaction</text><text x="145" y="382" text-anchor="middle" font-size="14" fill="#5B6B69">teller, counter cash</text><polyline points="332,280 332,330" fill="none" stroke="#34495E" stroke-width="2.2"/><rect x="247" y="330" width="169" height="84" rx="10" fill="#E4F2EC" stroke="#2E7D5B" stroke-width="2.5"/><text x="332" y="350" text-anchor="middle" font-size="13" fill="#5B6B69">«abstract»</text><text x="332" y="370" text-anchor="middle" font-size="16" font-weight="bold" fill="#1D2B2A" font-style="italic">CustomerPayment</text><text x="332" y="392" text-anchor="middle" font-size="14" fi