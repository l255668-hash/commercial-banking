nchor="middle" font-size="18" font-weight="bold" fill="#1D2B2A">Chargeback</text><text x="1488" y="506" text-anchor="middle" font-size="14" fill="#5B6B69">dispute, reason code</text><polyline points="1387,492 1401,492" fill="none" stroke="#34495E" stroke-width="2.2"/><polyline points="1387,432 1387,492" fill="none" stroke="#34495E" stroke-width="2.2"/></svg>
