<text x="34" y="1566" font-size="12.5" fill="#1D2B2A">Ledger: post() writes two entries, -1,500,000 on CUR-002 and +1,500,000 on the bank&#x27;s clearing account GL 2100; it refuses any legs that do not sum to zero.</text>
<text x="34" y="1586" font-size="12.5" fill="#1D2B2A">Not drawn: the AuditEvent every operation writes (Bank._log), and the refusal path: if any check fails, Bank._fail() marks the payment FAILED with the reason, and it is kept.</text>
<text x="34" y="1608" font-size="12" fill="#5B6B69">Solid arrow: call. Dashed arrow: return, or «create» a new object. Bar on :Bank: one operation in progress. Every value is read from the demonstration’s records.</text>
