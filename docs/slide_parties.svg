<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif"><rect width="1600" height="900" fill="#FFFFFF"/><text x="60" y="70" font-size="38" font-weight="bold" fill="#0B4F4A">Parties: one record per real person or organisation</text><text x="60" y="108" font-size="20" fill="#5B6B69">Customer, director and signatory are roles (dated objects), not subclasses</text><rect x="630" y="150" width="340" height="84" rx="10" fill="#E3EEF9" stroke="#3D5A80" stroke-width="2.5"/><text x="800" y="170" text-anchor="middle" font-size="13" fill="#5B6B69">«abstract»</text><text x="800" y="190" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A" font-style="italic">Party</text><text x="800" y="212" text-anchor="middle" font-size="14" fill="#5B6B69">identity, documents, checks, KYC</text><polyline points="800,252 800,280" fill="none" stroke="#34495E" stroke-width="2.2"/><polygon points="800,234 789,252 811,252" fill="#FFFFFF" stroke="#34495E" stroke-width="2.2"/><polyline points="641,280 959,280" fill="none" stroke="#34495E" stroke-width="2.2"/><polyline points="641,280 641,330" fill="none" stroke="#34495E" stroke-width="2.2"/><rect x="491" y="330" width="300" height="84" rx="10" fill="#E4F2EC" stroke="#2E7D5B" stroke-width="2.5"/><text x="641" y="350" text-anchor="middle" font-size="13" fill="#5B6B69">«abstract»</text><text x="641" y="370" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A" font-style="italic">Organization</text><text x="641" y="392" text-anchor="middle" font-size="14" fill="#5B6B69">officers, owners, mandates</text><polygon points="507,414 496,432 518,432" fill="#FFFFFF" stroke="#34495E" stroke-width="2.2"/><rect x="521" y="454" width="270" height="76" rx="10" fill="#FBEFD9" stroke="#B8862F" stroke-width="2.5"/><text x="656" y="484" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A">Charity</text><text x="656" y="506" text-anchor="middle" font-size="14" fill="#5B6B69">needs 2 trustees</text><polyline points="507,492 521,492" fill="none" stroke="#34495E" stroke-width="2.2"/><rect x="521" y="546" width="270" height="76" rx="10" fill="#FBEFD9" stroke="#B8862F" stroke-width="2.5"/><text x="656" y="576" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A">Company</text><text x="656" y="598" text-anchor="middle" font-size="14" fill="#5B6B69">needs a director</text><polyline points="507,584 521,584" fill="none" stroke="#34495E" stroke-width="2.2"/><polyline points="507,432 507,584" fill="none" stroke="#34495E" stroke-width="2.2"/><polyline points="959,280 959,330" fill="none" stroke="#34495E" stroke-width="2.2"/><rect x="809" y="330" width="300" height="84" rx="10" fill="#E4F2EC" stroke="#2E7D5B" stroke-width="2.5"/><text x="959" y="360" text-anchor="middle" font-size="21" font-weight="bold" fill="#1D2B2A">Person</text><text x="959" y="382" text-anchor="middle" font-size="14" fill="#5B6B69">date of birth</text></svg>
