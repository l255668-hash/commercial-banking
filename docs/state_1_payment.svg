<text x="468" y="642" text-anchor="middle" font-size="11" fill="#8A5A00" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">post()</text>
<text x="568" y="534" text-anchor="middle" font-size="11" fill="#8A5A00" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke">funds re-check fails</text>
